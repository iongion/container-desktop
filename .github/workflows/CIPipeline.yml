name: CIPipeline

# Continuous-integration gate (companion to the CDPipeline.* release pipelines, which build/package releases).
# The release pipeline runs no checks, so this guards every PR and push to main with the full
# verification set: type-check, lint, unit tests and a production build. The support/cli tooling is
# type-checked, linted and unit-tested as part of the same app job (check-types / lint:check / test:run).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: yarn install --frozen-lockfile --production=false
      - name: Type-check
        run: yarn check-types
      - name: Lint (biome check, no writes)
        run: yarn lint:check
      - name: Unit tests (hermetic; live suite excluded by config)
        run: yarn test:run
      - name: Production build
        # ENVIRONMENT=production exercises the packaged single-file layout (CLAUDE.md). A plain
        # `yarn build` defaults to development and would give false confidence.
        run: ENVIRONMENT=production yarn build
