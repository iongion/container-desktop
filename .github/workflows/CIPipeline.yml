name: CIPipeline

# Continuous-integration gate (companion to the CDPipeline.* release pipelines, which build/package releases).
# The release pipeline runs no checks, so this guards every PR and push to main with the full
# verification set: type-check, lint, unit tests, a production build and the Tauri backend's rustfmt and clippy. The support/cli tooling is
# type-checked, linted and unit-tested as part of the same app job (check-types / lint:check / test:run).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App — types, lint, tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
      - name: Use pnpm (the packageManager version in package.json)
        shell: bash
        run: npm install -g "$(node -p "require('./package.json').packageManager")"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Use Rust (with rustfmt and clippy)
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Install Linux build deps (what the Tauri backend compiles against)
        run: bash support/provision-deps.sh
      - name: Type-check
        run: pnpm check-types
      - name: Lint (biome check, no writes)
        run: pnpm lint:check
      - name: Unit tests (hermetic; live suite excluded by config)
        run: pnpm test:run
      - name: Production build
        # ENVIRONMENT=production exercises the packaged single-file layout (CLAUDE.md). A plain
        # `pnpm build` defaults to development and would give false confidence.
        run: ENVIRONMENT=production pnpm build
      - name: Lint the Tauri backend (rustfmt check, clippy -D warnings; needs the build above, which it embeds)
        run: pnpm lint:tauri
